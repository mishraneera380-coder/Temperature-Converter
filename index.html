<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card">
        <div class="card-head">
            <h1>Temperature Converter</h1>
            <p>Convert instantly between Celsius, Fahrenheit &amp; Kelvin</p>
        </div>

        <div class="input-row">
            <label for="tempInput">Enter Temperature</label>
            <input type="text" id="tempInput" placeholder="e.g. 27" inputmode="decimal" autocomplete="off">
            <div class="error-msg" id="errorMsg">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="errorText">Please enter a valid number.</span>
            </div>
        </div>

        <div class="unit-row">
            <label class="field-label">Input Unit</label>
            <div class="segmented">
                <input type="radio" name="unit" id="unitC" value="C" checked>
                <label for="unitC">°C</label>
                <input type="radio" name="unit" id="unitF" value="F">
                <label for="unitF">°F</label>
                <input type="radio" name="unit" id="unitK" value="K">
                <label for="unitK">K</label>
            </div>
        </div>

        <button class="convert-btn" id="convertBtn">Convert</button>

        <div class="abs-zero-msg" id="absZeroMsg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 9v4M12 17h.01M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
           </svg>
           <span>That's below absolute zero (−273.15°C) — the coldest temperature physically possible. Please enter a value at or above that.</span>
       </div>


        <div class="results" id="results">
            <div class="result-card" id="cardC">
                <span class="icon">❄️</span>
                <div class="value" id="valC">-</div>
                <div class="unit-label">Celsius</div>
            </div>

            <div class="result-card" id="cardF">
                <span class="icon">🌤️</span>
                <div class="value" id="valF">-</div>
                <div class="unit-label">Fahrenheit</div>
            </div>

            <div class="result-card" id="cardK">
                <span class="icon">🔥</span>
                <div class="value" id="valK">-</div>
                <div class="unit-label">Kelvin</div>   
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
